# Quality Gates CI Pipeline
#
# Runs automated quality gates on every push and PR.
# Covers gates 1 (lint), 2 (tests), and 9 (build) from the workflow.
# Manual gates (responsive, performance, accessibility, visual) are
# verified during /review.
#
# Steps check whether the script exists in package.json before running.
# If a script is missing, the step is skipped (not silently passed).
# Once your project has all scripts configured, the guards are a no-op.

name: Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ===== Node.js / TypeScript Projects =====
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Check available scripts
        id: scripts
        run: |
          if [ ! -f package.json ]; then
            echo "No package.json found — skipping all gates"
            echo "has_pkg=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_pkg=true" >> "$GITHUB_OUTPUT"
          # Detect which npm scripts exist
          node -e "
            const pkg = require('./package.json');
            const scripts = pkg.scripts || {};
            const has = (name) => scripts[name] ? 'true' : 'false';
            console.log('has_lint=' + has('lint'));
            console.log('has_typecheck=' + has('typecheck'));
            console.log('has_test=' + has('test'));
            console.log('has_build=' + has('build'));
          " >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.scripts.outputs.has_pkg == 'true'
        run: npm ci

      # Gate 1: Lint
      - name: Lint
        if: steps.scripts.outputs.has_lint == 'true'
        run: npm run lint

      # Gate 1b: Type check
      - name: Type check
        if: steps.scripts.outputs.has_typecheck == 'true'
        run: npm run typecheck

      # Gate 2: Tests
      - name: Run tests
        if: steps.scripts.outputs.has_test == 'true'
        run: npm run test -- --passWithNoTests

      # Gate 9: Build
      - name: Build
        if: steps.scripts.outputs.has_build == 'true'
        run: npm run build

  # ===== React Native / pnpm Projects =====
  # Uncomment this job if using pnpm (e.g., MOP React Native foundation):
